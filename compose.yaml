# Local PostgreSQL for the ITSM helpdesk.
#
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps data)
# Wipe:   docker compose down -v       (deletes the volume and all data)
#
# Only the database is containerised. The FastAPI backend and the React app
# run natively on the host so hot reload works and both share one .env file.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - itsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  itsm_pgdata:
